spring:
    application:
        name: sky-take-out-server
    profiles:
        active: dev
    datasource:
        driver-class-name: ${datasource.driver-class-name}
        url: ${datasource.url}
        username: ${datasource.username}
        password: ${datasource.password}

mybatis:
    type-aliases-package: com.pluto.model
    configuration:
        map-underscore-to-camel-case: true
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

#jwt:
#      secret: thisdasdas-is-a-dsadasdvery-dasdlosadng-secret-for-jwt-generation-and-exposhuog-sadfes
#      expiration: 60 * 60 * 24 # 1 day

pagehelper:
    reasonable: true
    auto-dialect: true

springdoc:
    api-docs:
        path: /api-docs
    swagger-ui:
        path: /docs.html
        operations-sorter: alpha
        
aliyun:
    oss:
        endpoint: oss-cn-guangzhou.aliyuncs.com
        bucket-name: java-web-itheima-111
        region: cn-guangzhou